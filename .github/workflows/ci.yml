name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Dev_Pass123!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Dev_Pass123!' -No -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build --configuration Release
      - run: dotnet test tests/Sms.Tests.Unit --configuration Release
      - run: dotnet test tests/Sms.Tests.Integration --configuration Release
        env:
          SMS_TEST_SQL_CONNECTION: "Server=localhost,1433;Database=master;User Id=sa;Password=Ci_Dev_Pass123!;TrustServerCertificate=True;Encrypt=False"
      - name: Install sqlcmd (go-sqlcmd)
        run: |
          curl -sSLo sqlcmd.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.0/sqlcmd-linux-amd64.tar.bz2
          tar xjf sqlcmd.tar.bz2 && sudo mv sqlcmd /usr/local/bin/
      - name: Production migration CLI is idempotent (migrate twice)
        run: |
          sqlcmd -S localhost,1433 -U sa -P 'Ci_Dev_Pass123!' -C -Q "IF DB_ID('SmsCli') IS NULL CREATE DATABASE SmsCli;"
          CONN="Server=localhost,1433;Database=SmsCli;User Id=sa;Password=Ci_Dev_Pass123!;TrustServerCertificate=True;Encrypt=False"
          dotnet run --project db/Sms.Migrations --configuration Release -- "$CONN"
          dotnet run --project db/Sms.Migrations --configuration Release -- "$CONN"
